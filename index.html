<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelas Ceria - Platform Pembelajaran Interaktif</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Utama -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar glass">
    <div class="logo">
      <i class="fa-solid fa-shapes"></i> Kelas<span>Ceria</span>
    </div>
    
    <ul class="nav-links">
      <li><a href="#home" class="nav-item active" onclick="switchPage('home')">Home</a></li>
      <li><a href="#materi" class="nav-item" onclick="switchPage('materi')">Materi</a></li>
      <li><a href="#latihan" class="nav-item" onclick="switchPage('latihan')">Latihan</a></li>
    </ul>

    <div class="user-profile" id="userProfile">
      <button class="btn-google" onclick="loginGoogle()">
        <i class="fa-brands fa-google"></i> Masuk Google
      </button>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="container">

    <!-- 1. HALAMAN HOME -->
    <section id="page-home" class="page active">
      <div class="hero glass">
        <div class="hero-text">
          <h1>Selamat Datang di <span class="highlight">Kelas Ceria</span></h1>
          <p>Platform belajar interaktif, seru, dan menyenangkan untuk siswa!</p>
          <div style="margin-top: 20px;">
            <button class="btn-primary" onclick="switchPage('materi')">Mulai Belajar 🚀</button>
            <button class="btn-google" id="heroLoginBtn" onclick="loginGoogle()" style="margin-left: 10px;">
              <i class="fa-brands fa-google"></i> Login Siswa
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. HALAMAN MATERI -->
    <section id="page-materi" class="page">
      <div class="page-header glass">
        <h2>📚 Materi Pembelajaran</h2>
        <button class="btn-admin admin-only" onclick="toggleAdminForm('materi')">+ Tambah Materi (Admin)</button>
      </div>

      <!-- Form Tambah Materi (Admin Only) -->
      <div id="form-materi-container" class="admin-form glass hidden">
        <h3>Tambah Materi Baru</h3>
        <input type="text" id="materi-title" placeholder="Judul Materi">
        <input type="text" id="materi-img" placeholder="URL Gambar Banner (Opsional)">
        <textarea id="materi-desc" placeholder="Isi / Rangkuman Materi Pembelajaran"></textarea>
        <button class="btn-primary" onclick="saveMateri()">Simpan Materi</button>
      </div>

      <!-- Tempat Daftar Materi Dimuat -->
      <div class="card-grid" id="materi-list"></div>
    </section>

    <!-- 3. HALAMAN LATIHAN (PILTIHAN GANDA) -->
    <section id="page-latihan" class="page">
      <div class="page-header glass">
        <h2>🎮 Latihan & Kuis Pilihan Ganda</h2>
        <button class="btn-admin admin-only" onclick="toggleAdminForm('latihan')">+ Tambah Soal (Admin)</button>
      </div>

      <!-- Form Tambah Soal Pilihan Ganda (Admin Only) -->
      <div id="form-latihan-container" class="admin-form glass hidden">
        <h3>Tambah Soal Pilihan Ganda</h3>
        <input type="text" id="latihan-title" placeholder="Judul Kuis / Mata Pelajaran (misal: Matematika Bab 1)">
        <textarea id="latihan-question" placeholder="Tuliskan Pertanyaan / Soal"></textarea>
        
        <input type="text" id="opt-a" placeholder="Pilihan A">
        <input type="text" id="opt-b" placeholder="Pilihan B">
        <input type="text" id="opt-c" placeholder="Pilihan C">
        <input type="text" id="opt-d" placeholder="Pilihan D">
        
        <label style="font-weight:bold; margin-top:8px; display:block;">Kunci Jawaban Benar:</label>
        <select id="correct-answer" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc;">
          <option value="A">Pilihan A</option>
          <option value="B">Pilihan B</option>
          <option value="C">Pilihan C</option>
          <option value="D">Pilihan D</option>
        </select>

        <button class="btn-primary" onclick="saveLatihan()">Simpan Soal</button>
      </div>

      <!-- Tempat Daftar Soal Pilihan Ganda Dimuat -->
      <div id="latihan-list"></div>
    </section>

  </main>

  <!-- SCRIPT UTAMA (TYPE MODULE SANGAT PENTING!) -->
  <script type="module" src="app.js"></script>
</body>
</html>
